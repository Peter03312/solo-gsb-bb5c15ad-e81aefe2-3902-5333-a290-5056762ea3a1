services:
  timeline:
    build: .
    container_name: retro-timeline
    ports:
      - "${PORT:-8000}:8000"   # 宿主机端口:容器端口，可用 PORT 环境变量覆盖
    environment:
      PORT: "8000"             # 容器内监听端口
      DB_PATH: /data/timeline.db
      # HOST: 0.0.0.0
    volumes:
      - timeline-data:/data    # SQLite 数据持久化
    restart: unless-stopped

volumes:
  timeline-data:
